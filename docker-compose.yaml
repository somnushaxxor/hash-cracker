version: '3.8'
services:
  manager:
    build: manager
    ports:
      - '8080:8080'
    environment:
      - WORKER_HOST=worker
      - WORKER_PORT=8080
      - TASK_EXECUTION_MAX_DURATION=PT30S

  worker:
    build: worker
    expose:
      - '8080'
    environment:
      - MANAGER_HOST=manager
      - MANAGER_PORT=8080
      - EXECUTOR_MAX_POOL_SIZE=100